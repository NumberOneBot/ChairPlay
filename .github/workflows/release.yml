name: Release

on:
  push:
    tags: ['v*']
  # A dry run from the Actions tab: the same tests and installer, as version 0.0.0, kept as the run's artifact; no release.
  workflow_dispatch:
    inputs:
      bundle_mfi:
        description: 'Include the MFi pair from Actions secrets in the installer'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      BUNDLE_MFI: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_mfi || github.event_name == 'push' && vars.BUNDLE_MFI == 'true' }}
    steps:
      - name: Read the version from the tag
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -cnotmatch '^v\d+\.\d+\.\d+$') { throw "The tag '$tag' is not vX.Y.Z. Push a tag such as v0.1.0." }
          $version = $tag.Substring(1)
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Use version 0.0.0 for a dry run
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: '"VERSION=0.0.0" >> $env:GITHUB_ENV'

      # Files with LF as on the owner's PC: the runner's git defaults to core.autocrlf=true.
      - name: Check out text files with LF
        run: git config --global core.autocrlf input

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: true

      # The runner image may come with another Inno Setup: upgrade or downgrade to the pinned one, and show which runs.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup --version 6.7.1 -y --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { throw "choco upgrade innosetup failed with exit code $LASTEXITCODE." }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $info = (Get-Item $iscc).VersionInfo
          "ISCC $($info.ProductVersion) (file $($info.FileVersion)) at $iscc"

      - name: Test MFi packaging with generated identities
        shell: pwsh
        env:
          TEST_ISCC: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
          TEST_POWERSHELL: pwsh
        run: python packaging/installer/test_mfi.py -v

      - name: Test and build the app image
        shell: pwsh
        run: ./gradlew.bat check jpackageImage "-Pchairplay.version=$env:VERSION" --console=plain

      - name: Prepare optional MFi files
        if: env.BUNDLE_MFI == 'true'
        shell: pwsh
        env:
          MFI_PRIVATE_KEY_B64: ${{ secrets.MFI_PRIVATE_KEY_B64 }}
          MFI_CERTIFICATE_B64: ${{ secrets.MFI_CERTIFICATE_B64 }}
        run: ./packaging/installer/PrepareMfi.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'chairplay-mfi')

      # The portable zip carries the same optional MFi pair as the installer.
      - name: Package the installer and the portable zip
        shell: pwsh
        run: |
          $buildArgs = @('installer', 'portableZip', "-Pchairplay.version=$env:VERSION", "-Pinno.iscc=${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", '--console=plain')
          if ($env:BUNDLE_MFI -eq 'true') {
            $buildArgs += "-Pinstaller.mfiDir=$(Join-Path $env:RUNNER_TEMP 'chairplay-mfi')"
          }
          ./gradlew.bat @buildArgs
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }

      - name: Remove temporary MFi files
        if: always() && env.BUNDLE_MFI == 'true'
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'chairplay-mfi'
          foreach ($name in @('identity.pk8', 'certificate.p7b')) {
            $file = Join-Path $staging $name
            if (Test-Path -LiteralPath $file) { Remove-Item -LiteralPath $file -Force }
          }
          if (Test-Path -LiteralPath $staging) { Remove-Item -LiteralPath $staging -Force }

      - name: Draft the release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ghArgs = @('release', 'create', $env:GITHUB_REF_NAME, "build/installer/ChairPlay-$env:VERSION-setup.exe", "build/portable/ChairPlay-$env:VERSION-portable.zip", '--draft', '--title', $env:GITHUB_REF_NAME, '--notes=')
          if ($env:VERSION.StartsWith('0.')) { $ghArgs += '--prerelease' }
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE." }

      - name: Keep the dry run's installer
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ChairPlay-0.0.0-setup
          path: build/installer/ChairPlay-0.0.0-setup.exe
          if-no-files-found: error

      - name: Keep the dry run's portable zip
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ChairPlay-0.0.0-portable
          path: build/portable/ChairPlay-0.0.0-portable.zip
          if-no-files-found: error
